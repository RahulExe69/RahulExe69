<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .tool { font-family: 'Courier New', monospace; font-size: 14px; fill: #f5f7ff; }
      .pct { font-family: 'Courier New', monospace; font-size: 11px; fill: #5c6270; }
    </style>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff2"/><stop offset="100%" stop-color="#7f5cff"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e97"/><stop offset="100%" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff88"/><stop offset="100%" stop-color="#00fff2"/>
    </linearGradient>
    <pattern id="segMask" width="14" height="8" patternUnits="userSpaceOnUse">
      <rect width="11" height="8" fill="#fff"/>
    </pattern>
    <mask id="segments"><rect width="900" height="440" fill="url(#segMask)"/></mask>
    <filter id="gg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="440" fill="#08060f" rx="10"/>
  <text x="30" y="34" font-family="'Courier New', monospace" font-size="12" fill="#5c6270" letter-spacing="2">// TOOLS THAT SURVIVED CONTACT WITH MY ACTUAL PROJECTS //</text>

  <!-- row helper pattern repeated manually -->
  <!-- HTML/CSS/JS -->
  <g transform="translate(30,55)">
    <text y="14" class="tool">HTML / CSS / JavaScript</text>
    <rect x="0" y="24" width="420" height="14" fill="#160f2e" stroke="#2a2440"/>
    <g mask="url(#segments)">
      <rect x="0" y="24" width="0" height="14" fill="url(#b1)" filter="url(#gg)">
        <animate attributeName="width" values="0;400;400" keyTimes="0;0.35;1" dur="3.2s" begin="0.1s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- TypeScript/React -->
  <g transform="translate(30,100)">
    <text y="14" class="tool">TypeScript / React</text>
    <rect x="0" y="24" width="420" height="14" fill="#160f2e" stroke="#2a2440"/>
    <g mask="url(#segments)">
      <rect x="0" y="24" width="0" height="14" fill="url(#b1)" filter="url(#gg)">
        <animate attributeName="width" values="0;340;340" keyTimes="0;0.35;1" dur="3.2s" begin="0.3s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Python/C# -->
  <g transform="translate(30,145)">
    <text y="14" class="tool">Python / C#</text>
    <rect x="0" y="24" width="420" height="14" fill="#160f2e" stroke="#2a2440"/>
    <g mask="url(#segments)">
      <rect x="0" y="24" width="0" height="14" fill="url(#b1)" filter="url(#gg)">
        <animate attributeName="width" values="0;280;280" keyTimes="0;0.35;1" dur="3.2s" begin="0.5s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Three.js/WebGPU -->
  <g transform="translate(30,190)">
    <text y="14" class="tool">Three.js / WebGPU</text>
    <rect x="0" y="24" width="420" height="14" fill="#160f2e" stroke="#2a2440"/>
    <g mask="url(#segments)">
      <rect x="0" y="24" width="0" height="14" fill="url(#b2)" filter="url(#gg)">
        <animate attributeName="width" values="0;250;250" keyTimes="0;0.35;1" dur="3.2s" begin="0.7s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Unity/Godot -->
  <g transform="translate(30,235)">
    <text y="14" class="tool">Unity / Godot</text>
    <rect x="0" y="24" width="420" height="14" fill="#160f2e" stroke="#2a2440"/>
    <g mask="url(#segments)">
      <rect x="0" y="24" width="0" height="14" fill="url(#b2)" filter="url(#gg)">
        <animate attributeName="width" values="0;220;220" keyTimes="0;0.35;1" dur="3.2s" begin="0.9s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Supabase/Firebase -->
  <g transform="translate(30,280)">
    <text y="14" class="tool">Supabase / Firebase</text>
    <rect x="0" y="24" width="420" height="14" fill="#160f2e" stroke="#2a2440"/>
    <g mask="url(#segments)">
      <rect x="0" y="24" width="0" height="14" fill="url(#b3)" filter="url(#gg)">
        <animate attributeName="width" values="0;300;300" keyTimes="0;0.35;1" dur="3.2s" begin="1.1s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- CI/CD & deploy -->
  <g transform="translate(30,325)">
    <text y="14" class="tool">GitHub Actions / Vercel / Netlify</text>
    <rect x="0" y="24" width="420" height="14" fill="#160f2e" stroke="#2a2440"/>
    <g mask="url(#segments)">
      <rect x="0" y="24" width="0" height="14" fill="url(#b3)" filter="url(#gg)">
        <animate attributeName="width" values="0;360;360" keyTimes="0;0.35;1" dur="3.2s" begin="1.3s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Capacitor/Android -->
  <g transform="translate(30,370)">
    <text y="14" class="tool">Capacitor / Android</text>
    <rect x="0" y="24" width="420" height="14" fill="#160f2e" stroke="#2a2440"/>
    <g mask="url(#segments)">
      <rect x="0" y="24" width="0" height="14" fill="url(#b1)" filter="url(#gg)">
        <animate attributeName="width" values="0;310;310" keyTimes="0;0.35;1" dur="3.2s" begin="1.5s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <text x="30" y="425" class="pct" font-size="11">bar length = how often it shows up in my repos, not "mastery"</text>
</svg>
