<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .lbl { font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #f5f7ff; letter-spacing: 1px; }
      .sub { font-family: 'Courier New', monospace; font-size: 9px; fill: #7d8590; }
    </style>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14102b"/>
      <stop offset="100%" stop-color="#0a0718"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="900" height="380" fill="#08060f" rx="10"/>
  <rect width="900" height="380" fill="url(#scan2)" rx="10"/>

  <text x="450" y="30" text-anchor="middle" class="sub" font-size="11" fill="#5c6270" letter-spacing="3">// THE LOOP //</text>

  <!-- loop path -->
  <path d="M 150,65 L 450,65 L 750,65 L 750,195 L 750,325 L 450,325 L 150,325 L 150,195 Z"
        fill="none" stroke="#2a2440" stroke-width="2"/>
  <path d="M 150,65 L 450,65 L 750,65 L 750,195 L 750,325 L 450,325 L 150,325 L 150,195 Z"
        fill="none" stroke="#00fff2" stroke-width="2" stroke-dasharray="8 12" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-480" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle r="6" fill="#ff2e97" filter="url(#g)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 150,65 L 450,65 L 750,65 L 750,195 L 750,325 L 450,325 L 150,325 L 150,195 Z"/>
  </circle>

  <!-- IDEA -->
  <g filter="url(#g)">
    <rect x="80" y="38" width="140" height="54" rx="4" fill="url(#panel)" stroke="#00fff2" stroke-width="2"/>
    <rect x="80" y="38" width="10" height="10" fill="#00fff2"/>
    <rect x="210" y="82" width="10" height="10" fill="#00fff2"/>
  </g>
  <text x="150" y="60" text-anchor="middle" class="lbl">💡 IDEA</text>
  <text x="150" y="76" text-anchor="middle" class="sub">"can I build this?"</text>

  <!-- BUILD -->
  <g filter="url(#g)">
    <rect x="380" y="38" width="140" height="54" rx="4" fill="url(#panel)" stroke="#7f5cff" stroke-width="2"/>
  </g>
  <text x="450" y="60" text-anchor="middle" class="lbl">⚡ BUILD</text>
  <text x="450" y="76" text-anchor="middle" class="sub">AI + experimentation</text>

  <!-- BREAK -->
  <g filter="url(#g)">
    <rect x="680" y="38" width="140" height="54" rx="4" fill="url(#panel)" stroke="#ff2e97" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="750" y="60" text-anchor="middle" class="lbl">💀 BREAK</text>
  <text x="750" y="76" text-anchor="middle" class="sub">it always breaks</text>

  <!-- DEBUG -->
  <g filter="url(#g)">
    <rect x="665" y="168" width="170" height="54" rx="4" fill="url(#panel)" stroke="#ffd23f" stroke-width="2"/>
  </g>
  <text x="750" y="190" text-anchor="middle" class="lbl">🔍 DEBUG</text>
  <text x="750" y="206" text-anchor="middle" class="sub">"why isn't this working"</text>

  <!-- WORKAROUND -->
  <g filter="url(#g)">
    <rect x="665" y="298" width="170" height="54" rx="4" fill="url(#panel)" stroke="#ffd23f" stroke-width="2"/>
  </g>
  <text x="750" y="318" text-anchor="middle" class="lbl" font-size="12">🔧 WORKAROUND</text>
  <text x="750" y="334" text-anchor="middle" class="sub">found a way around it</text>

  <!-- LEARN -->
  <g filter="url(#g)">
    <rect x="380" y="298" width="140" height="54" rx="4" fill="url(#panel)" stroke="#7f5cff" stroke-width="2"/>
  </g>
  <text x="450" y="320" text-anchor="middle" class="lbl">🧠 LEARN</text>
  <text x="450" y="336" text-anchor="middle" class="sub">(accidentally)</text>

  <!-- SHIP -->
  <g filter="url(#g)">
    <rect x="80" y="298" width="140" height="54" rx="4" fill="url(#panel)" stroke="#39ff88" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="150" y="320" text-anchor="middle" class="lbl">🚀 SHIP</text>
  <text x="150" y="336" text-anchor="middle" class="sub">it's alive</text>

  <!-- NEW IDEA -->
  <g filter="url(#g)">
    <rect x="65" y="168" width="170" height="54" rx="4" fill="url(#panel)" stroke="#00fff2" stroke-width="2"/>
  </g>
  <text x="150" y="190" text-anchor="middle" class="lbl">🎲 NEW IDEA</text>
  <text x="150" y="206" text-anchor="middle" class="sub">and round we go</text>

  <text x="450" y="200" text-anchor="middle" class="sub" font-size="11" fill="#484f58">the loop never really stops</text>
</svg>
