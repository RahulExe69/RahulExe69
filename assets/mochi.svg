<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 116" role="img" aria-labelledby="title desc">
<title id="title">Mochi animated profile companion</title>
<desc id="desc">A tiny white kitten with pink ears, sparkling eyes and a red bow.</desc>
<style>
  .bob{animation:bob 4.8s ease-in-out infinite}
  .tail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 1.8s ease-in-out infinite}
  .blink{animation:blink 4.8s steps(1,end) infinite}
  .walk{animation:walk 4.8s ease-in-out infinite}
  .spark{animation:spark 4.8s ease-in-out infinite}
  @keyframes bob{0%,18%,100%{transform:translateY(0)}24%{transform:translateY(-2px)}38%{transform:translateY(0)}52%{transform:translateY(-12px) scale(.94,1.06)}62%{transform:translateY(0) scale(1.03,.96)}78%{transform:translateY(0)}}
  @keyframes tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(13deg)}}
  @keyframes blink{0%,45%,49%,100%{opacity:1}46%,48%{opacity:0}}
  @keyframes walk{0%,18%,78%,100%{transform:translateX(0)}28%{transform:translateX(6px)}38%{transform:translateX(12px)}48%{transform:translateX(7px)}58%{transform:translateX(0)}68%{transform:translateX(-3px)}}
  @keyframes spark{0%,38%,100%{opacity:0;transform:scale(.5)}48%,58%{opacity:1;transform:scale(1)}}
</style>
<g class="walk">
  <ellipse cx="80" cy="102" rx="18" ry="4" fill="#2a2733" opacity=".13"/>
  <g class="bob">
