<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090f"/>
      <stop offset="100%" stop-color="#0c0620"/>
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e97"/>
      <stop offset="33%" stop-color="#00fff2"/>
      <stop offset="66%" stop-color="#7f5cff"/>
      <stop offset="100%" stop-color="#ff2e97"/>
      <animate attributeName="x1" values="-20%;120%;-20%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;220%;80%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="900" height="260" rx="12"/></clipPath>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.18"/>
    </pattern>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#7f5cff" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>

    <!-- neon border frame -->
    <rect x="2" y="2" width="896" height="256" rx="10" fill="none" stroke="url(#neonBorder)" stroke-width="3" filter="url(#glow)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="32" fill="#0f0a24"/>
    <rect x="0" y="30" width="900" height="2" fill="url(#neonBorder)"/>
    <circle cx="22" cy="16" r="5" fill="#ff2e97"/>
    <circle cx="42" cy="16" r="5" fill="#ffd23f"/>
    <circle cx="62" cy="16" r="5" fill="#00fff2"/>
    <text x="450" y="21" font-family="'Courier New', monospace" font-size="12" fill="#7f5cff" text-anchor="middle" letter-spacing="2">RAHUL.EXE — SYSTEM ONLINE</text>

    <!-- pixel avatar frame slot (left) -->
    <g transform="translate(28,55)">
      <rect x="0" y="0" width="90" height="90" fill="#0f0a24" stroke="#00fff2" stroke-width="2" filter="url(#glow)"/>
      <rect x="6" y="6" width="78" height="78" fill="none" stroke="#ff2e97" stroke-width="1" stroke-dasharray="4 3" opacity="0.7">
        <animate attributeName="stroke-dashoffset" from="0" to="14" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="45" y="50" text-anchor="middle" font-family="monospace" font-size="10" fill="#484f58">avatar.png</text>
    </g>

    <!-- terminal text block -->
    <g font-family="'Courier New', monospace">
      <text x="145" y="80" font-size="13" fill="#00fff2" filter="url(#glow)">&gt; boot sequence initiated_</text>

      <text x="145" y="118" font-size="34" font-weight="bold" fill="#f5f7ff" filter="url(#glowStrong)" letter-spacing="3">
        RAHUL
      </text>
      <!-- glitch ghost layers -->
      <text x="146" y="118" font-size="34" font-weight="bold" fill="#ff2e97" opacity="0" letter-spacing="3">
        RAHUL
        <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="1s" repeatCount="indefinite" keyTimes="0;0.02;0.05"/>
      </text>
      <text x="144" y="119" font-size="34" font-weight="bold" fill="#00fff2" opacity="0" letter-spacing="3">
        RAHUL
        <animate attributeName="opacity" values="0;0.6;0" dur="4s" begin="1.05s" repeatCount="indefinite" keyTimes="0;0.02;0.05"/>
      </text>

      <!-- typewriter line 1 -->
      <text x="145" y="148" font-size="16" fill="#ffd23f" opacity="0">
        I build things.
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.4;0.45" dur="9s" repeatCount="indefinite"/>
      </text>
      <!-- typewriter line 2 -->
      <text x="145" y="148" font-size="16" fill="#ffd23f" opacity="0">
        Idea first. Everything else, figured out along the way.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.5;0.85;0.9" dur="9s" repeatCount="indefinite"/>
      </text>
      <!-- typewriter line 3 -->
      <text x="145" y="148" font-size="16" fill="#ffd23f" opacity="0">
        started with copy-pasting HTML. still going.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.91;0.94;0.99;1" dur="9s" repeatCount="indefinite"/>
      </text>

      <rect x="145" y="156" width="9" height="15" fill="#ffd23f">
        <animate attributeName="opacity" values="1;1;0;0" dur="0.9s" repeatCount="indefinite"/>
      </rect>

      <text x="145" y="180" font-size="11" fill="#5c6270">[ STATUS: shipping something, probably broken ]</text>
    </g>

    <!-- floating pixel bits -->
    <g fill="#00fff2" opacity="0.6">
      <rect x="820" y="60" width="5" height="5"><animate attributeName="y" values="60;40;60" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="850" y="100" width="4" height="4" fill="#ff2e97"><animate attributeName="y" values="100;80;100" dur="3.6s" repeatCount="indefinite"/></rect>
      <rect x="800" y="150" width="4" height="4" fill="#7f5cff"><animate attributeName="y" values="150;130;150" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="860" y="180" width="5" height="5"><animate attributeName="y" values="180;160;180" dur="3.3s" repeatCount="indefinite"/></rect>
    </g>

    <!-- scanline overlay -->
    <rect width="900" height="260" fill="url(#scanlines)"/>

    <!-- flicker vignette -->
    <rect width="900" height="260" fill="#000000" opacity="0">
      <animate attributeName="opacity" values="0;0;0.04;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
